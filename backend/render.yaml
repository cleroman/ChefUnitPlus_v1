# ============================================================
# ChefUnitPlus - Configuration Render.com
# ============================================================
services:
  - type: web
    name: chefunitplus-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_TYPE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: chefunitplus-db
          property: connectionString
      - key: DB_SSL
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: chefunitplus-db
    databaseName: chefunitplus
    user: chefunitplus_user
    plan: free
    region: frankfurt
