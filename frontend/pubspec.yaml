name: chefunitplus
description: ChefUnitPlus - Plateforme mobile de formation en leadership
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  flutter_pdfview: ^1.3.2
  video_player: ^2.8.6
  chewie: ^1.7.5
  open_filex: ^4.4.0
  url_launcher: ^6.2.5
  mobile_scanner: ^5.1.0
  path_provider: ^2.1.0
  http_parser: ^4.0.2
  http: ^1.2.0
  file_picker: ^10.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  printing: ^5.13.4
  pdf: ^3.11.1
  fl_chart: ^0.69.0
  qr_flutter: ^4.1.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/



# ============================================================
# Icones de l'application
# ============================================================
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#7B1FA2"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48

# ============================================================
# Splash screen
# ============================================================
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  android: true
  ios: true
  web: true
  android_12:
    image: assets/images/logo.png
    color: "#FFFFFF"
